<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Router Admin 运行总览</title><desc id="desc">展示容器、内部和外部用户路由以及待绑定身份的后台界面</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font-size:13px}.muted{fill:#697386}.head{fill:#172033;font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}</style>
  <rect width="1280" height="720" fill="#f6f8fc"/><rect width="244" height="720" fill="#121a2a"/>
  <text x="28" y="49" fill="white" font-size="19" font-weight="800">◆ Hermes Admin</text>
  <rect x="15" y="79" width="214" height="43" rx="8" fill="#252e44"/><text x="29" y="106" fill="white" font-size="14">总览</text>
