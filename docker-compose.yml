x-storage-environment: &storage-environment
  STORAGE_DRIVER: sqlite
  SQLITE_PATH: /data/hermes-router.db

services:
  router:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: router
    restart: unless-stopped
    environment:
      <<: *storage-environment
      FEISHU_APP_NAME: ${FEISHU_APP_NAME:-主机器人}
      FEISHU_APP_ID: ${FEISHU_APP_ID:?请在 .env 中设置 FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?请在 .env 中设置 FEISHU_APP_SECRET}
      FEISHU_STREAM_ENABLED: ${FEISHU_STREAM_ENABLED:-true}
      FEISHU_DEBUG_LOG_EVENTS: ${FEISHU_DEBUG_LOG_EVENTS:-false}
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:?请在 .env 中设置 PLATFORM_BASE_URL}
      PLATFORM_USERNAME: ${PLATFORM_USERNAME:?请在 .env 中设置 PLATFORM_USERNAME}
      PLATFORM_PASSWORD: ${PLATFORM_PASSWORD:?请在 .env 中设置 PLATFORM_PASSWORD}
    volumes:
      - router-data:/data

  admin:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:8081"
    environment:
      <<: *storage-environment
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?请在 .env 中设置 ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?请在 .env 中设置 ADMIN_SESSION_SECRET}
    volumes:
      - router-data:/data

volumes:
  router-data:
