<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Router Admin 外部用户路由</title><desc id="desc">展示按入口应用和外部 Open ID 绑定 Hermes 容器的后台界面</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font-size:13px}.muted{fill:#697386}.head{fill:#172033;font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.input{fill:white;stroke:#dce1ea}</style>
  <rect width="1280" height="720" fill="#f6f8fc"/><rect width="244" height="720" fill="#121a2a"/><text x="28" y="49" fill="white" font-size="19" font-weight="800">◆ Hermes Admin</text><text x="29" y="106" fill="#aeb8cb" font-size="14">总览</text><text x="29" y="158" fill="#aeb8cb" font-size="14">容器管理</text><text x="29" y="210" fill="#aeb8cb" font-size="14">内部用户路由</text><rect x="15" y="235" width="214" height="43" rx="8" fill="#252e44"/><text x="29" y="262" fill="white" font-size="14">外部用户路由</text>
  <text x="290" y="57" fill="#5b56e8" font-size="11" font-weight="800" letter-spacing="2">IDENTITY BINDING</text><text x="290" y="94" class="head" font-size="28">外部用户路由</text><text x="290" y="119" class="muted small">外部成员必须按入口应用 app_id 与 open_id 成对绑定。</text><text x="1174" y="63" class="muted small">退出登录</text>
  <rect x="290" y="153" width="944" height="196" rx="14" fill="white" stroke="#e7eaf0"/><text x="313" y="189" class="head" font-size="18">新增外部路由</text><text x="313" y="219" class="muted small">入口 App ID</text><rect x="313" y="230" width="204" height="39" rx="8" class="input"/><text x="326" y="255" class="mono" fill="#172033">cli_xxx</text><text x="537" y="219" class="muted small">外部 Open ID</text><rect x="537" y="230" width="204" height="39" rx="8" class="input"/><text x="550" y="255" class="mono" fill="#172033">ou_47a8c2</text><text x="761" y="219" class="muted small">Container ID</text><rect x="761" y="230" width="204" height="39" rx="8" class="input"/><text x="774" y="255" class="mono" fill="#172033">hermes-consultant-a</text><text x="985" y="219" class="muted small">Platform remark_name</text><rect x="985" y="230" width="204" height="39" rx="8" class="input"/><text x="998" y="255" class="mono" fill="#172033">consultant-a</text><rect x="313" y="296" width="15" height="15" rx="3" fill="#5b56e8"/><text x="337" y="309" class="small" fill="#172033">启用</text><rect x="391" y="284" width="90" height="37" rx="8" fill="#5b56e8"/><text x="413" y="308" fill="white" class="small" font-weight="700">保存外部路由</text>
  <rect x="290" y="370" width="944" height="265" rx="14" fill="white" stroke="#e7eaf0"/><text x="313" y="408" class="head" font-size="18">外部路由列表</text><text x="425" y="408" class="muted small">2 条</text><rect x="893" y="387" width="218" height="35" rx="8" class="input"/><text x="907" y="409" class="muted small">按 app_id、open_id、容器搜索</text><rect x="1120" y="387" width="66" height="35" rx="8" fill="#5b56e8"/><text x="1137" y="410" fill="white" class="small">查询</text>
  <rect x="312" y="443" width="900" height="34" fill="#fafbfc"/><text x="327" y="465" class="muted small">入口应用</text><text x="444" y="465" class="muted small">Open ID</text><text x="581" y="465" class="muted small">容器</text><text x="765" y="465" class="muted small">用户名</text><text x="891" y="465" class="muted small">状态</text><text x="970" y="465" class="muted small">更新时间</text>
